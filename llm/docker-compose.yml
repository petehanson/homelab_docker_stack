name: llm

networks:
  proxy:
    external: true

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    profiles:
        - ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/hddpool/models/ollama:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "989"   # render — replace with actual GID from: getent group render
      - "985"   # video  — replace with actual GID from: getent group video
    networks:
      - proxy

  # llama.cpp server-vulkan, one container per hosted model. Not published to
  # the host — reached via the proxy network, either from other containers as
  # http://llama-<name>:8080 or externally through Caddy. To add another
  # model, copy this block, rename the service/container, and point volumes
  # + command at the new model file (override the volume path per-host in
  # docker-compose.override.yml, same as ollama above).
  #
  # `profiles` keeps this out of the default `up`/`up.sh` — start it manually
  # with: docker compose --profile llama up -d llama-qwen
  # Once started, restart: unless-stopped keeps it running across reboots
  # until you explicitly stop/down it.
  # llama-coder:
  #   image: ghcr.io/ggml-org/llama.cpp:server-vulkan
  #   container_name: llama-coder
  #   restart: unless-stopped
  #   devices:
  #     - /dev/dri
  #   group_add:
  #     - "989"   # render — from: getent group render
  #     - "986"   # video  — from: getent group video
  #   volumes:
  #     - /storage2/llama.cpp:/models
  #   command:
  #     - -m
  #     - /models/models--unsloth--Qwen3.6-27B-MTP-GGUF/snapshots/5cb35eb3dcbf52dbce5f87dbc64df6aaffadcace/Qwen3.6-27B-Q4_K_M.gguf

  #     - --alias
  #     - "Qwen3.6:27b-MTP"
  #     - -ngl
  #     - "999"
  #     - --spec-type
  #     - "draft-mtp"
  #     - --spec-draft-n-max
  #     - "3"
  #     #- --n-cpu-moe
  #     #- "35"
  #     #- -c
  #     #- "256000"
  #     #- --no-mmap
  #     - --host
  #     - 0.0.0.0
  #   networks:
  #     - proxy

  llama-coder:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-coder
    restart: unless-stopped
    devices:
      - /dev/dri
    group_add:
      - "989"   # render — from: getent group render
      - "986"   # video  — from: getent group video
    volumes:
      - /storage2/llama.cpp:/models
    command:
      - -m
      - /models/models--unsloth--Qwen3.8-27B-UD-Q4_K_XL-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf
      - --alias
      - "Qwen3.8:27b-UD-Q4_K_XL"
      - -ngl
      - "999"
      - --spec-type
      - "draft-mtp"
      - --spec-draft-n-max
      - "3"

      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "0.0"
      - --repeat-penalty
      - "1.0"
      #- --n-cpu-moe
      #- "35"
      #- -c
      #- "256000"
      #- --no-mmap
      - --host
      - 0.0.0.0
    networks:
      - proxy


  llama-mini:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-mini
    restart: unless-stopped
    profiles:
        - llama-mini
    devices:
      - /dev/dri
    group_add:
      - "989"   # render — from: getent group render
      - "986"   # video  — from: getent group video
    volumes:
      - /storage2/llama.cpp:/models
    command:
      - -m
      - /models/models--google--gemma-4-E2B-it-qat-q4_0-gguf/snapshots/1894d1fc0a19d86697abd40483f5983c867df03f/gemma-4-E2B_q4_0-it.gguf
      - --alias
      - "Gemma4:e2b-Q4_0"
      - -ngl
      - "999"
      - --chat-template-kwargs
      - '{"enable_thinking": false}'
      - -c
      - "64000"
      - --host
      - 0.0.0.0
    networks:
      - proxy
